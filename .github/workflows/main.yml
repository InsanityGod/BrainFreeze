name: Update translations

on:
  workflow_dispatch:

env:
  # ============================================================
  # Mod-specific configuration
  # ============================================================

  MOD_LANG_PATH: "BrainFreeze/assets/brainfreeze/lang"
  TRANSLATION_ZIP: "brainfreeze-theinsanitygod.zip"

  # Dropbox shared folder
  DROPBOX_FOLDER: "https://www.dropbox.com/scl/fo/q7u3idxz3edsytki8n6m4/h"
  DROPBOX_KEY: "y14td00uvfhihpqhffuagmjtd"

  # Git
  BASE_BRANCH: "master"
  TRANSLATION_BRANCH: "translation-update"

jobs:
  translations:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download translations
        shell: bash
        run: |
          URL="${DROPBOX_FOLDER}/${TRANSLATION_ZIP}?rlkey=${DROPBOX_KEY}&e=1&dl=1"

          echo "Downloading ${TRANSLATION_ZIP}..."

          curl --fail --location --silent --show-error \
            "$URL" \
            --output translations.zip

          echo "Download complete:"
          ls -lh translations.zip

      - name: Extract translations
        shell: bash
        run: |
          rm -rf translations
          mkdir translations

          unzip -q translations.zip -d translations

          echo "Files in archive:"
          find translations -type f -print

      - name: Install translations
        shell: bash
        run: |
          mkdir -p "$MOD_LANG_PATH"

          echo "Translation JSON files found in archive:"
          find translations -type f -name '*.json' -print

          find translations \
            -type f \
            -name '*.json' \
            -exec cp {} "$MOD_LANG_PATH/" \;

          echo
          echo "Installed translations:"
          find "$MOD_LANG_PATH" \
            -maxdepth 1 \
            -type f \
            -name '*.json' \
            -printf '%f\n' \
            | sort

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- "$MOD_LANG_PATH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No translation changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo "Translation changes detected:"
            git diff --stat -- "$MOD_LANG_PATH"
          fi

      - name: Prepare translation branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$BASE_BRANCH"

          git checkout -B "$TRANSLATION_BRANCH" "origin/$BASE_BRANCH"

      - name: Apply translations to branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          mkdir -p "$MOD_LANG_PATH"

          find translations \
            -type f \
            -name '*.json' \
            -exec cp {} "$MOD_LANG_PATH/" \;

          git status --short

      - name: Commit translations
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git add "$MOD_LANG_PATH"

          git commit \
            -m "Update translations"

      - name: Push translation branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git push \
            --force \
            origin \
            "HEAD:$TRANSLATION_BRANCH"

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          PR_NUMBER="$(gh pr list \
            --head "$TRANSLATION_BRANCH" \
            --base "$BASE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$TRANSLATION_BRANCH" \
              --title "Update translations" \
              --body "Automated update of translations."
          else
            echo "Pull request #${PR_NUMBER} already exists."
            echo "The existing PR has been updated."
          fi
