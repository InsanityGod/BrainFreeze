name: Crowdin Action

on:
  workflow_dispatch:

jobs:
  crowdin:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Crowdin sync
        uses: crowdin/github-action@v3
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          localization_branch_name: crowdin_translations
          
          create_pull_request: true
          pull_request_base_branch_name: 'master'
          
          source: brainfreeze-theinsanitygod.json               # Sources pattern
          translation: BrainFreeze\assets\brainfreeze\lang\%locale%.json    # Translations pattern
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
